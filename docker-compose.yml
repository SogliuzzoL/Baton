version: "3.8"

services:
  baton-bot:
    image: baton-bot:local
    env_file:
      - .env
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == swarm1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
